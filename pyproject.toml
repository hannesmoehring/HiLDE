[project]
name = "shd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "hdbscan>=0.8.43",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "kdbcv",
    "matplotlib>=3.10.8",
    "nbformat>=5.10.4",
    "numba>=0.65.1",
    "numpy>=2.4.4,<2.5",
    "optuna",
    "pandas>=3.0.2",
    "plotly>=6.3.1",
    "rich>=15.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "streamlit>=1.50.0",
    "tabulate>=0.10.0",
    "umap-learn>=0.5.11",
    "uvicorn[standard]>=0.30",
    "watchdog>=6.0.0",
    "zadu>=0.4.2",
]

[dependency-groups]
dev = ["pyinstrument>=5.1.2"]

[tool.uv]
# kdbcv 1.0.0 (its only release) hard-caps numpy<2 and scipy<=1.14.1, which is
# incompatible with this project's modern numpy 2.4 / scipy 1.18 stack. Its DBCV
# code only uses APIs that are stable across those versions (verified), so we
# override the stale caps. The one import-time incompatibility (a removed
# np.float_ alias in kdbcv's type hints) is shimmed in src_research/dbcv_tuning.py.
override-dependencies = ["numpy>=2.4.4,<2.5", "scipy>=1.17.1"]
