<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="HiLDE">
  <title>HiLDE</title>
  <!-- Condensed hierarchy: the root splits, one branch splits again into two
       leaves, the other runs deep. Drawn as filled rects rather than strokes,
       on an even grid, so every edge stays crisp when scaled to 16/32/48px. -->
  <rect width="32" height="32" fill="#161614"/>
  <g fill="#ffffff">
    <rect x="16" y="4" width="2" height="6"/>
    <rect x="10" y="8" width="16" height="2"/>
    <rect x="10" y="10" width="2" height="6"/>
    <rect x="24" y="10" width="2" height="18"/>
    <rect x="6" y="14" width="10" height="2"/>
    <rect x="6" y="16" width="2" height="12"/>
    <rect x="14" y="16" width="2" height="12"/>
  </g>
</svg>
