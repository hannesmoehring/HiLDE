services:
  shd:
    build: .
    image: shd:latest
    mem_limit: 28g
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # Persist scikit-learn downloads (MNIST/Fashion-MNIST/Olivetti) alongside the rest
      - SCIKIT_LEARN_DATA=/app/datasets/sklearn
    volumes:
      # Local datasets (wine CSVs, MNIST raw IDX) plus anything a loader downloads
      # on first use (QM9, the sklearn cache) — writable so it can populate itself
      - ./datasets:/app/datasets
      # Persist completed analysis runs (hosting-mode cache)
      - ./.cache/hilde_runs:/app/.cache/hilde_runs
