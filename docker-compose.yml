services:
  shd:
    build: .
    image: shd:latest
    # The VPS has 1862 MB RAM, ~1120 MB free with HiLDE stopped, and shares it with
    # Portainer, NPM and cloudflared. 640m is ~57% of that, leaving ~480 MB for
    # their growth, the kernel and page cache; no swap for the container, so it
    # cannot push the box into swapping. Cache-only serving peaks well under it.
    mem_limit: 640m
    memswap_limit: 640m
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # Persist scikit-learn downloads (MNIST/Fashion-MNIST/Olivetti) alongside the rest
      - SCIKIT_LEARN_DATA=/app/datasets/sklearn
    volumes:
      # Local datasets (wine CSVs, MNIST raw IDX) plus anything a loader downloads
      # on first use (QM9, the sklearn cache) — writable so it can populate itself
      - ./datasets:/app/datasets
      # Persist completed analysis runs (hosting-mode cache)
      - ./.cache/hilde_runs:/app/.cache/hilde_runs
