services:
  shd:
    build: .
    image: shd:latest
    mem_limit: 24g
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # Persist scikit-learn downloads (MNIST/Fashion-MNIST/Olivetti) to the mounted cache
      - SCIKIT_LEARN_DATA=/app/.cache/sklearn
    volumes:
      # Local datasets (wine CSVs, MNIST raw IDX) without baking them into the image
      - ./datasets:/app/datasets:ro
      # Persist downloaded datasets across container restarts
      - ./.cache/sklearn:/app/.cache/sklearn
