services:
  hilde:
    build: .
    image: hilde:latest
    # Runs are built on demand. If the site is public, anyone can trigger a build;
    # the cap below keeps a runaway build from taking the host down. Override it in
    # a .env file next to this one (HILDE_MEM_LIMIT=12g). No swap beyond the cap, so
    # a build that exceeds it is OOM-killed instead of pushing the host into swapping.
    mem_limit: ${HILDE_MEM_LIMIT:-8g}
    memswap_limit: ${HILDE_MEM_LIMIT:-8g}
    # Builds share the API's process, so an OOM kill takes the whole server down;
    # come back on our own after that and after a reboot.
    restart: unless-stopped
    # Builds may use at most 4 cores. Override with HILDE_CPUS in .env.
    cpus: ${HILDE_CPUS:-4}
    ports:
      # Loopback only: a reverse proxy or tunnel on the host reaches localhost:8000;
      # other machines cannot reach the container directly.
      - "127.0.0.1:8000:8000"
    environment:
      - PORT=8000
      # Persist scikit-learn downloads (MNIST/Fashion-MNIST/Olivetti) alongside the rest
      - SCIKIT_LEARN_DATA=/app/datasets/sklearn
    volumes:
      # Local datasets (wine CSVs, MNIST raw IDX) plus anything a loader downloads
      # on first use (QM9, the sklearn cache) — writable so it can populate itself
      - ./datasets:/app/datasets
      # Persist completed analysis runs (hosting-mode cache)
      - ./.cache/hilde_runs:/app/.cache/hilde_runs
